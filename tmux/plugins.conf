set -g @plugin 'tmux-plugins/tpm'

# Plugins to help with saving and restoring tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Change save dir for tmux-resurrect
set -g @resurrect-dir '~/.tmux/resurrect'

# Save tmux seesion at intervals (15 default)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Auto start at boot using Ghostty
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'ghostty'

# Restore additional programs
set -g @resurrect-processes 'ssh claude'

